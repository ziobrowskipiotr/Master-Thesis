name: ARM64 Master Thesis Benchmarks

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Kompilacja CMake (Clang)
      run: |
        cmake -B build
        cmake --build build -j$(nproc)

    - name: Generowanie datasetow (Python)
      run: |
        python3 scripts/generate_datasets.py

    - name: Uruchomienie benchmarkow (Python)
      run: |
        python3 scripts/run_benchmarks.py

    - name: Artefakty wykresow i logow
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          benchmark_results.png
          benchmark_raw_data.csv